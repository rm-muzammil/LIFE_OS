<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Self-Khilafah</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      gap: 1.5rem;
    }
    .icon {
      width: 64px; height: 64px;
      background: #16a34a22;
      border: 1px solid #16a34a44;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto;
    }
    h1 { font-size: 1.25rem; font-weight: 600; color: #f4f4f5; }
    p  { font-size: 0.875rem; color: #71717a; line-height: 1.6; max-width: 280px; }
    .ayah {
      font-family: 'Amiri', Georgia, serif;
      font-size: 1.1rem;
      color: #a1a1aa;
      direction: rtl;
      line-height: 2;
      margin-top: 0.5rem;
    }
    .ayah-trans { font-size: 0.75rem; color: #52525b; font-style: italic; }
    button {
      background: #16a34a;
      color: white;
      border: none;
      padding: 0.625rem 1.5rem;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:active { background: #15803d; }
  </style>
</head>
<body>
  <div class="icon">☁️</div>
  <div>
    <h1>You're offline</h1>
    <p style="margin-top: 0.5rem">
      No internet connection right now. Your logged data is safe — reconnect to sync.
    </p>
  </div>
  <div>
    <p class="ayah">وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ</p>
    <p class="ayah-trans">"Man gets only what he strives for." — 53:39</p>
  </div>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
